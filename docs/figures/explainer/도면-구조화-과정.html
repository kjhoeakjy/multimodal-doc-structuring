<title>도면 한 장의 구조화 과정</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* 배치: 왼쪽은 도면 무대(카메라 이동), 오른쪽은 단계 설명과 그래프·색인 시각. 좁은 화면은 세로 적층 */
:root{
  --bg:#F5F6F8; --panel:#FFFFFF; --fg:#15181D; --mute:#5F6670; --line:#D9DCE2; --soft:#EEF0F4;
  --acc:#1F4FD8; --acc-soft:#E6ECFB;
  --eq:#C8322E; --sym:#1F4FD8; --ins:#7A2BD1; --pipe:#1E8E57; --sig:#2F80ED; --tbl:#8A9099; --jct:#E0A400; --ink:#15181D; --ink-dim:#B8BDC6;
  --sans:"Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --mono:"IBM Plex Mono", "SFMono-Regular", Menlo, Consolas, monospace;
  --ease:cubic-bezier(.2,.7,.2,1);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0F1115; --panel:#171A20; --fg:#E7E9EE; --mute:#9AA1AC; --line:#2A2F39; --soft:#1F242D;
  --acc:#6D8DF2; --acc-soft:#1B2540; --eq:#F0665F; --sym:#6D8DF2; --ins:#B07CF5; --pipe:#43C98A; --sig:#5DA6FF; --tbl:#7C838E; --jct:#F2C94C; --ink:#E7E9EE; --ink-dim:#3A404B; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0F1115; --panel:#171A20; --fg:#E7E9EE; --mute:#9AA1AC; --line:#2A2F39; --soft:#1F242D;
  --acc:#6D8DF2; --acc-soft:#1B2540; --eq:#F0665F; --sym:#6D8DF2; --ins:#B07CF5; --pipe:#43C98A; --sig:#5DA6FF; --tbl:#7C838E; --jct:#F2C94C; --ink:#E7E9EE; --ink-dim:#3A404B; color-scheme:dark }

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:14px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 32px}
.wrap{max-width:1480px;margin:0 auto}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 24px;padding:26px 0 14px;border-bottom:1px solid var(--line)}
.eyebrow{font-size:12px;letter-spacing:.06em;color:var(--mute);font-weight:500}
h1{font-size:clamp(20px,2.4vw,28px);margin:4px 0 0;font-weight:700;letter-spacing:-.01em;text-wrap:balance}
.controls{display:flex;align-items:center;gap:8px}
button{font:inherit;color:var(--fg);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:6px 12px;cursor:pointer}
button:hover{border-color:var(--acc)}
button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
button.primary{background:var(--acc);border-color:var(--acc);color:#fff;min-width:88px}
.rail{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:6px;margin:14px 0 16px}
.chip{position:relative;overflow:hidden;border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:8px 10px;cursor:pointer;min-width:0;text-align:left}
.chip small{display:block;font-size:11px;color:var(--mute);font-variant-numeric:tabular-nums}
.chip span{display:block;font-size:12.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip .bar{position:absolute;left:0;bottom:0;height:3px;width:0;background:var(--acc)}
.chip.active{border-color:var(--acc);box-shadow:inset 0 0 0 1px var(--acc)}
.chip.done small{color:var(--acc)}
main{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);gap:18px;align-items:start}
@media (max-width:980px){main{grid-template-columns:1fr}.rail{grid-template-columns:repeat(5,minmax(0,1fr))}}
.stage{background:var(--panel);border:1px solid var(--line);border-radius:8px;overflow:hidden;min-width:0}
.stage .top{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 14px;border-bottom:1px solid var(--line);font-size:12px;color:var(--mute)}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
#view{display:block;width:100%;height:auto;aspect-ratio:420/297;background:#fff}
:root[data-theme="dark"] #view{background:#FFFFFF}
.caption{padding:10px 14px;font-size:12.5px;color:var(--mute);border-top:1px solid var(--line);min-height:40px;font-variant-numeric:tabular-nums}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:18px 20px;min-width:0;display:flex;flex-direction:column;gap:14px;min-height:560px}
.stepno{font-family:var(--mono);font-size:12px;color:var(--acc);letter-spacing:.04em}
h2{margin:2px 0 0;font-size:20px;font-weight:700;letter-spacing:-.01em}
.desc p{margin:0;font-size:13px;color:var(--mute)}
.desc .rule{font-family:var(--mono);font-size:12px;background:var(--soft);border-radius:4px;padding:2px 6px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:8px}
.kpi{border-top:2px solid var(--line);padding-top:6px}
.kpi b{display:block;font-size:22px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.1}
.kpi span{font-size:12px;color:var(--mute)}
.kpi.acc{border-top-color:var(--acc)}
.visual:not(:has(section.show)){display:none}
.visual{position:relative;flex:1;min-height:430px;border:1px solid var(--line);border-radius:6px;background:var(--bg);overflow:hidden}
.visual > section{position:absolute;inset:0;padding:14px;opacity:0;transition:opacity .5s var(--ease);pointer-events:none;overflow:auto}
.visual > section.show{opacity:1;pointer-events:auto}
.visual h3{margin:0 0 8px;font-size:12px;letter-spacing:.06em;color:var(--mute);font-weight:500}
pre{margin:0;font-family:var(--mono);font-size:11.5px;line-height:1.5;white-space:pre-wrap;word-break:break-all;color:var(--fg)}
pre .ln{display:block;opacity:0;transform:translateY(4px);transition:opacity .4s var(--ease),transform .4s var(--ease)}
pre .ln.in{opacity:1;transform:none}
pre .hl{background:var(--acc-soft);color:var(--acc);border-radius:3px;padding:0 3px}
#gsvg{width:100%;height:100%;display:block}
#gsvg text{font-family:var(--mono);font-size:10.5px;fill:var(--fg)}
#gsvg .e{stroke:var(--pipe);stroke-width:1.6;fill:none;opacity:.9}
#gsvg .e.signal{stroke:var(--sig);stroke-dasharray:3 2}
#gsvg .n{stroke:none}
.lanes{display:grid;grid-template-columns:1fr;gap:8px}
.lane{display:grid;grid-template-columns:118px 1fr;gap:10px;align-items:start;border:1px solid var(--line);border-radius:6px;padding:9px 10px;background:var(--panel);opacity:0;transform:translateY(6px);transition:opacity .5s var(--ease),transform .5s var(--ease)}
.lane.in{opacity:1;transform:none}
.lane .src{font-size:12px;font-weight:500}
.lane .src small{display:block;color:var(--mute);font-weight:400;font-size:11px;margin-top:2px}
.lane .dst{min-width:0}
.lane .how{font-size:12px;color:var(--mute);margin-bottom:5px}
.tokens{display:flex;flex-wrap:wrap;gap:4px}
.tok{font-family:var(--mono);font-size:11px;padding:1px 6px;border-radius:3px;background:var(--soft);border:1px solid var(--line);opacity:0;transform:translateX(-6px);animation:tin .45s var(--ease) forwards;animation-delay:var(--d,0s)}
.tok.key{background:var(--acc-soft);border-color:transparent;color:var(--acc)}
@keyframes tin{to{opacity:1;transform:none}}
.vec{display:flex;align-items:flex-end;gap:2px;height:34px}
.vec i{display:block;width:5px;background:var(--acc);height:2px;transform-origin:bottom;animation:grow .6s var(--ease) forwards;animation-delay:var(--d,0s);transform:scaleY(.05);opacity:.9}
@keyframes grow{to{transform:scaleY(1)}}
.kv{font-family:var(--mono);font-size:11px;display:grid;grid-template-columns:auto 1fr;gap:2px 10px}
.kv span{color:var(--mute)}
.qa .q{font-size:15px;font-weight:700;margin:0 0 10px}
.qa .box{border:1px solid var(--line);border-radius:6px;padding:9px 11px;background:var(--panel);margin-bottom:8px;opacity:0;transform:translateY(6px);transition:opacity .5s var(--ease),transform .5s var(--ease)}
.qa .box.in{opacity:1;transform:none}
.qa .box h4{margin:0 0 5px;font-size:11.5px;letter-spacing:.05em;color:var(--mute);font-weight:500}
.ref{display:inline-block;font-family:var(--mono);font-size:11px;padding:1px 6px;border-radius:3px;background:var(--acc-soft);color:var(--acc);margin:1px 2px;cursor:pointer;border:1px solid transparent}
.ref:hover{border-color:var(--acc)}
.foot{margin-top:18px;font-size:12px;color:var(--mute);display:flex;flex-wrap:wrap;gap:6px 18px;justify-content:space-between}

/* 도면 요소 */
#drawing .p{transition:stroke .6s var(--ease),fill .6s var(--ease),opacity .6s var(--ease);transition-delay:var(--d,0s)}
#drawing .p-line,#drawing .p-curve,#drawing .p-arc{stroke:var(--ink)}
#drawing .p-text{fill:var(--ink)}
#view.typed .p-line{stroke:#2B6CB0}
#view.typed .p-curve{stroke:#C05621}
#view.typed .p-arc{stroke:#6B46C1}
#view.typed .p-text{fill:#2F855A}
#view.dim .p-line,#view.dim .p-curve,#view.dim .p-arc{stroke:#B8BDC6}
#view.dim .p-text{fill:#9AA0A8}
#view.faint .p{opacity:.35}
.layer{opacity:0;transition:opacity .5s var(--ease)}
.layer.on{opacity:1}
.nd{fill:none;stroke-width:.5;opacity:0;transform-box:fill-box;transform-origin:center;transform:scale(.6);transition:opacity .45s var(--ease),transform .45s var(--ease);transition-delay:var(--d,0s)}
.on .nd{opacity:1;transform:none}
.nd.equipment{stroke:var(--eq)} .nd.symbol{stroke:var(--sym)} .nd.instrument{stroke:var(--ins)} .nd.nozzle{stroke:var(--sym)} .nd.note{stroke:var(--ins);stroke-dasharray:1 .6}
.rn{fill:none;stroke-width:.9;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1;transition:stroke-dashoffset .9s var(--ease);transition-delay:var(--d,0s)}
.on .rn{stroke-dashoffset:0}
.rn.pipe{stroke:var(--pipe)} .rn.signal{stroke:var(--sig)} .rn.gapped{stroke-dasharray:.08 .06;stroke-dashoffset:0;opacity:0;transition:opacity .6s;} .on .rn.gapped{opacity:1}
.jc{fill:var(--jct);stroke:#fff;stroke-width:.3;opacity:0;transition:opacity .4s var(--ease);transition-delay:var(--d,0s)}
.on .jc{opacity:1}
.lb{stroke:var(--mute);stroke-width:.25;opacity:0;transition:opacity .5s var(--ease);transition-delay:var(--d,0s)}
.on .lb{opacity:.9}
.lbx{fill:none;stroke:var(--mute);stroke-width:.2;opacity:0;transition:opacity .5s var(--ease);transition-delay:var(--d,0s)}
.on .lbx{opacity:.8}
.tag rect{fill:var(--fg);opacity:.92} .tag text{fill:var(--bg);font-size:2.4px;font-family:var(--mono)}
.tag{opacity:0;transition:opacity .4s var(--ease);transition-delay:var(--d,0s)} .on .tag{opacity:1}
.hi{fill:none;stroke:var(--acc);stroke-width:1.1;opacity:0;transition:opacity .4s var(--ease)} .on .hi{opacity:1}
.hi.path{stroke-width:1.6;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1;transition:stroke-dashoffset 1.2s var(--ease),opacity .3s;transition-delay:var(--d,0s)} .on .hi.path{stroke-dashoffset:0}
.glow{fill:var(--acc);opacity:0;transition:opacity .5s} .on .glow{opacity:.12}
.frm{fill:none;stroke:var(--tbl);stroke-width:.4;stroke-dasharray:1.5 1;opacity:0;transition:opacity .5s var(--ease);transition-delay:var(--d,0s)} .on .frm{opacity:1}
.tbl-fill{fill:var(--tbl);opacity:0;transition:opacity .6s var(--ease);transition-delay:var(--d,0s)} .on .tbl-fill{opacity:.12}
.tbl-tag text{font-size:2.6px;fill:var(--tbl);font-family:var(--mono)} .tbl-tag{opacity:0;transition:opacity .5s;transition-delay:var(--d,0s)} .on .tbl-tag{opacity:1}
.scan{fill:var(--acc);opacity:0} .on .scan{animation:scan 1.8s var(--ease) forwards}
@keyframes scan{0%{opacity:0}30%{opacity:.08}100%{opacity:0}}
@media (prefers-reduced-motion: reduce){*{transition-duration:0s!important;animation-duration:0s!important;transition-delay:0s!important;animation-delay:0s!important}}
</style>

D.graph.nodes.forEach(n => { gpos[n.id] = [sx(n.start[0]), sy(n.start[1])]; });
const gEdges = D.graph.edges.map(e => ({...e, el: el('line', {class:'e '+e.kind}, gs)}));
D.graph.nodes.forEach(n => { const g = el('g', {}, gs); const col = {equipment:'var(--eq)', instrument:'var(--ins)', symbol:'var(--sym)', nozzle:'var(--sym)', note:'var(--ins)', junction:'var(--jct)'}[n.role];
  const r = {equipment:9, instrument:7, junction:3}[n.role] || 4.5; el('circle', {r, fill:col, class:'n'}, g);
  if (['equipment','instrument'].includes(n.role) || n.name.match(/^[0-9A-Z]{2}[A-Z0-9]+-\d+$/)) { const t = el('text', {x:r+3, y:3}, g); t.textContent = n.name; } gn[n.id] = g; });
$('#gn').textContent = D.graph.nodes.length; $('#ge').textContent = D.graph.edges.length;
function drawGraph(){ for (const id in gn) gn[id].setAttribute('transform', `translate(${gpos[id][0].toFixed(1)} ${gpos[id][1].toFixed(1)})`);
  gEdges.forEach(e => { const a = gpos[e.a], b = gpos[e.b]; if (!a||!b) return; e.el.setAttribute('x1', a[0]); e.el.setAttribute('y1', a[1]); e.el.setAttribute('x2', b[0]); e.el.setAttribute('y2', b[1]); }); }
drawGraph();
let gAnim = null;
function graphTo(key){ const from = {}; for (const id in gpos) from[id] = gpos[id].slice(); const to = {}; D.graph.nodes.forEach(n => to[n.id] = key === 'end' ? n.end : [sx(n.start[0]), sy(n.start[1])]);
  const t0 = performance.now(); cancelAnimationFrame(gAnim); const dur = reduced ? 0 : 1600;
  const step = now => { const k = dur ? Math.min(1, (now - t0) / dur) : 1; const e = 1 - Math.pow(1 - k, 3); for (const id in gpos) gpos[id] = [from[id][0] + (to[id][0]-from[id][0])*e, from[id][1] + (to[id][1]-from[id][1])*e]; drawGraph(); if (k < 1) gAnim = requestAnimationFrame(step); }; gAnim = requestAnimationFrame(step); }
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

// ---- 직렬화 ----
const serialEl = $('#serial');
D.serial.slice(0, 28).forEach((l, i) => { const s = document.createElement('span'); s.className = 'ln'; s.style.transitionDelay = (i*0.12)+'s'; s.textContent = l; serialEl.appendChild(s); });

// ---- 색인 경로 ----
const lanes = $('#lanes');
function lane(src, sub, how, inner, i){ const d = document.createElement('div'); d.className = 'lane'; d.style.transitionDelay = (i*0.35)+'s'; d.innerHTML = `<div class="src">${src}<small>${sub}</small></div><div class="dst"><div class="how">${how}</div>${inner}</div>`; lanes.appendChild(d); }
const toks = ['n25','equipment','P4712','N1','N2','r9','pipe','j2','73KH12-25','MNc','47125','73HG12','SV','104.01','signal','TICSA','4750.03','TV4750.03'];
lane('관계 · 라벨', '그래프 텍스트', 'BM25 희소 색인 · 모델 없음',
  `<div class="tokens">${toks.map((t,i)=>`<span class="tok${/^[A-Z]{1,2}\d|^\d{2}[A-Z]{2}\d|^[A-Z]{2,5}$/.test(t)?' key':''}" style="--d:${(0.6+i*0.08).toFixed(2)}s">${t}</span>`).join('')}</div>`, 0);
lane('태그 · 선 번호', '^[A-Z]\\d{4}$', '완전 일치',
  `<div class="kv"><span>P4712</span><b>n25 equipment bbox=(245.8,148.8,256.2,159.2)</b><span>73KH12-25</span><b>n7 symbol bbox=(264.0,158.0,266.0,162.0)</b><span>MNc 47125 73HG12 25</span><b>r13 pipe j0→n4</b><span>TICSA 4750.03</span><b>n17 instrument</b></div>`, 1);
lane('표', '5개', '행 단위 텍스트',
  `<div class="kv">${D.table_rows.slice(1,4).map(r=>`<span>H1007</span><b>${r.join(' | ')}</b>`).join('')}</div>`, 2);
lane('쪽 · 그림 영역', '화소 배열', '이미지 임베딩 · 밀집 벡터 · 유일한 신경망',
  `<div class="vec">${Array.from({length:40},(_,i)=>`<i style="height:${(6+Math.abs(Math.sin(i*1.7)*22+Math.cos(i*.9)*6)).toFixed(0)}px;--d:${(1.2+i*0.03).toFixed(2)}s"></i>`).join('')}</div>`, 3);
lane('좌표', 'mm', '근거 표시', `<div class="kv"><span>n25</span><b>(245.8, 148.8, 256.2, 159.2)</b><span>j2</span><b>(265.0, 154.0)</b><span>r13</span><b>(269,154)→(269,96)</b></div>`, 4);

// ---- 질의 ----
$('#qa').innerHTML = `<p class="q">"P4712 펌프의 토출 측은 어디로 연결되는가"</p>
<div class="box" style="transition-delay:.2s"><h4>1 완전 일치</h4><div class="kv"><span>P4712</span><b>n25 equipment, 노즐 N1(흡입) N2(토출)</b></div></div>
<div class="box" style="transition-delay:1s"><h4>2 부분 그래프 · n25에서 3단계</h4><pre>${D.subgraph.slice(1).map((l,i)=>`<span class="ln in" style="transition-delay:${(1.2+i*.15).toFixed(2)}s">${l.replace(/(n25|j2|j0|n3|n7|n4|n29|n2)(\[|\b)/g,'<span class="hl">$1</span>$2')}</span>`).join('')}</pre></div>
<div class="box" style="transition-delay:2.8s"><h4>3 텍스트 LLM 입력</h4><div style="font-size:12.5px">위 텍스트 + 질문 · 이미지 없음 · 약 300 토큰</div></div>
<div class="box" style="transition-delay:3.6s"><h4>4 답변과 근거</h4><div style="font-size:13px">N2 → 분기점 <span class="ref" data-ref="j2">j2</span> → 밸브 <span class="ref" data-ref="n7">73KH12-25</span> / 안전밸브 <span class="ref" data-ref="n4">SV 104.01</span> / 73KH12-50 경유 H1008</div><div class="how" style="margin-top:6px">근거 클릭 시 도면 위치 표시</div></div>`;
document.querySelectorAll('.ref').forEach(r => r.addEventListener('click', () => { const id = r.dataset.ref; const n = byId[id]; if (!n) return; const c = n.bbox ? center(n.bbox) : n.pt; setCam([c[0]-30, c[1]-21, 60, 42], `근거 ${id} 주변`); }));

// ---- 단계 정의 ----
const K = (b, s, acc) => `<div class="kpi${acc?' acc':''}"><b>${b}</b><span>${s}</span></div>`;
const STEPS = [
 {name:'원본', title:'원본 입력: 벡터 그림', cam:'full', dur:7000,
  desc:`<p>선 · 곡선 · 타원 · 문자의 좌표와 굵기. 색 · 식별자 미사용</p>`,
  kpis:[K(D.counts.line,'직선'),K(D.counts.curve,'곡선'),K(D.counts.arc,'타원'),K(D.counts.text,'문자')], visual:'V-input', caption:'A3 420 × 297 mm'},
 {name:'요소 분해', title:'1 시각 요소 추출', cam:'full', dur:8000, view:'typed',
  desc:`<p>쪽 좌표(mm) 통일 · 유형 분류 · 모델 없음</p>`,
  kpis:[K('파랑','직선'),K('주황','곡선'),K('보라','타원'),K('초록','문자')], visual:'V-input', caption:'유형별 색'},
 {name:'틀·표', title:'2 틀과 표 분리', cam:'full', dur:7000, view:'dim', layers:['L-frame'],
  desc:`<p>틀 = 쪽 80% 이상 사각형 · 표 = 격자 90% + 문자 6개 이상</p>`,
  kpis:[K(D.tables.length,'표',true),K('8','행/표'),K('1','표제란'),K('329','남은 요소'),K('100','남은 문자')], visual:'V-input', caption:'회색 = 표 5 · 표제란 1'},
 {name:'도형·기호', title:'3 닫힌 도형과 기호 묶음', cam:'mid', dur:8000, view:'dim', layers:['L-frame','L-nodes'],
  desc:`<p>닫힌 도형 = 맞물린 선 · 타원 12 mm 이상 / 기호 = 접점 0.6 mm 묶음</p>`,
  kpis:[K(roleCount.equipment||0,'장비',true),K(roleCount.instrument||0,'계기'),K(roleCount.symbol||0,'기호'),K(roleCount.nozzle||0,'접속구'),K(roleCount.note||0,'주석')], visual:'V-input', caption:'상자 = 외접 사각형(mm)'},
 {name:'연결', title:'4 선 정리와 연결 판정', cam:'zoom', dur:10000, view:'dim', layers:['L-frame','L-nodes','L-runs'],
  desc:`<p>접속 = 선 끝 0.6 mm 안 · 간격 후보 = 5 mm 안 · 가는 선 = 신호선</p>`,
  kpis:[K(pipes,'배관 구간',true),K(sigs,'신호선'),K(D.junctions.length,'분기점'),K(D.runs.length-gaps,'확정 연결'),K(gaps,'간격 후보')], visual:'V-input', caption:'점선 = 간격 후보'},
 {name:'라벨', title:'5 문자 연결', cam:'zoom', dur:8000, view:'dim', layers:['L-frame','L-nodes','L-runs','L-labels'],
  desc:`<p>요소 안 또는 4 mm 안의 문자 · 선 번호 형식은 선에 소속</p>`,
  kpis:[K('100','문자',true),K('85','요소 라벨'),K('15','선 라벨'),K('60/62','소속 일치')], visual:'V-input', caption:'회색 선 = 소속'},
 {name:'역할', title:'6 역할 추정', cam:'tank', dur:8000, view:'dim', layers:['L-frame','L-nodes','L-runs','L-roles'],
  desc:`<p>장비 = 영문 1자 + 숫자 4자리 · 계기 = 기능 문자 + 루프 번호</p>`,
  kpis:[K('5','장비',true),K('4','계기'),K('19','기호'),K('0','모델')], visual:'V-input', caption:'꼬리표 = 역할 · 근거 형식'},
 {name:'그래프', title:'7 관계 그래프', cam:'full', dur:10000, view:'dim', layers:['L-nodes','L-runs'], graph:'end',
  desc:`<p>노드 = 요소 · 분기점 / 간선 = 배관 · 신호선 / 모두 원본 좌표 보유</p>`,
  kpis:[K(D.graph.nodes.length,'노드',true),K(D.graph.edges.length,'간선'),K('27/27','정답 쌍 복원'),K('0.7초','처리 시간')], visual:'V-graph', caption:'도면 위 표시와 오른쪽 그래프는 같은 객체'},
 {name:'색인', title:'8 직렬화와 특징별 색인', cam:'full', dur:14000, view:'faint', layers:['L-embed'], serial:true, lanesOn:true,
  desc:`<p>관계 · 라벨 = 그래프 텍스트 / 태그 = 완전 일치 / 표 = 행 / 쪽 · 그림 = 밀집 벡터</p>`,
  kpis:[K('4','색인 경로',true),K('1','신경망 모델'),K('1회','등록 시 처리'),K('mm','근거 좌표')], visual:'V-embed', caption:'파랑 = 이미지 임베딩 영역'},
 {name:'질의', title:'9 질의 시 처리', cam:'zoom', dur:14000, view:'dim', layers:['L-nodes','L-runs','L-query'], qaOn:true,
  desc:`<p>완전 일치 조회 · 3단계 부분 그래프 · 텍스트 LLM 입력 · 좌표 근거</p>`,
  kpis:[K('1','완전 일치 조회',true),K('3','탐색 단계'),K('8','전달 간선'),K('약 300','입력 토큰')], visual:'V-query', caption:'파랑 = 전달된 부분 그래프'},
];

// ---- 진행 제어 ----
const rail = $('#rail');
STEPS.forEach((s, i) => { const b = document.createElement('button'); b.className = 'chip'; b.innerHTML = `<small>${String(i).padStart(2,'0')}</small><span>${s.name}</span><i class="bar"></i>`; b.addEventListener('click', () => go(i, true)); rail.appendChild(b); });
let cur = -1, playing = true, t0 = 0, raf = 0;
function go(i, manual){ if (i < 0 || i >= STEPS.length) return; cur = i; const s = STEPS[i]; t0 = performance.now();
  view.className.baseVal = s.view || ''; setCam(CAM[s.cam][0], CAM[s.cam][1]);
  document.querySelectorAll('.layer').forEach(l => l.classList.toggle('on', (s.layers||[]).includes(l.id)));
  $('#stepno').textContent = `STEP ${String(i).padStart(2,'0')} / ${String(STEPS.length-1).padStart(2,'0')}`; $('#title').textContent = s.title; $('#desc').innerHTML = s.desc; $('#kpis').innerHTML = s.kpis.join(''); $('#caption').textContent = s.caption;
  document.querySelectorAll('.visual > section').forEach(v => v.classList.toggle('show', v.id === s.visual));
  document.querySelectorAll('.chip').forEach((c, j) => { c.classList.toggle('active', j === i); c.classList.toggle('done', j < i); c.querySelector('.bar').style.width = j < i ? '100%' : '0'; });
  if (s.graph) { graphTo('start'); setTimeout(() => graphTo('end'), 900); }
  serialEl.querySelectorAll('.ln').forEach(l => l.classList.toggle('in', !!s.serial));
  if (s.serial) { $('#V-serial').classList.add('show'); setTimeout(() => { if (cur === i) { $('#V-serial').classList.remove('show'); $('#V-embed').classList.add('show'); } }, 5000); }
  lanes.querySelectorAll('.lane').forEach(l => l.classList.toggle('in', !!s.lanesOn));
  if (s.lanesOn) { lanes.querySelectorAll('.lane').forEach(l => { l.style.transitionDelay = (5.2 + +l.style.transitionDelay.replace('s','') * 0 + Array.from(lanes.children).indexOf(l) * .35) + 's'; }); }
  $('#qa').querySelectorAll('.box').forEach(b => b.classList.toggle('in', !!s.qaOn));
  if (manual) { playing = true; $('#play').textContent = '일시정지'; }
}
function loop(now){ if (playing && cur >= 0) { const s = STEPS[cur]; const k = Math.min(1, (now - t0) / s.dur); const c = rail.children[cur]; if (c) c.querySelector('.bar').style.width = (k*100).toFixed(1)+'%'; if (k >= 1) go((cur + 1) % STEPS.length); } raf = requestAnimationFrame(loop); }
$('#play').addEventListener('click', () => { playing = !playing; $('#play').textContent = playing ? '일시정지' : '재생'; if (playing) t0 = performance.now(); });
$('#prev').addEventListener('click', () => go(Math.max(0, cur - 1), true));
$('#next').addEventListener('click', () => go(Math.min(STEPS.length - 1, cur + 1), true));
addEventListener('keydown', e => { if (e.key === 'ArrowRight') go(Math.min(STEPS.length-1, cur+1), true); else if (e.key === 'ArrowLeft') go(Math.max(0, cur-1), true); else if (e.key === ' ') { e.preventDefault(); $('#play').click(); } });
go(0); requestAnimationFrame(loop);
</script>
