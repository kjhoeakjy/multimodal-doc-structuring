<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="Pretendard, 'Noto Sans KR', sans-serif">
<defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 z" fill="#111111"/></marker></defs>
<rect width="1600" height="900" fill="#FFFFFF"/>
<text x="60" y="58" font-size="26" font-weight="600" fill="#111111" text-anchor="start" letter-spacing="-0.5">표와 이미지에 분산된 정보의 관계와 적용 조건을 보존하는 전처리 및 구조화</text>
<text x="60" y="86" font-size="14" font-weight="400" fill="#6B6B6B" text-anchor="start">설계 전제: 폐쇄망 운용, 제한된 연산 자원, 독립 실행 가능한 공개 모델</text>
<text x="1540" y="86" font-size="14" font-weight="400" fill="#6B6B6B" text-anchor="end">적용 대상: PDF와 스캔 형태의 기술문서(정비 교범, 시험 기준, 규격)</text>
