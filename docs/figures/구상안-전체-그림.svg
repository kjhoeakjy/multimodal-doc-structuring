<text x="74" y="324" font-size="12.5" font-weight="400" fill="#6B6B6B" text-anchor="start">텍스트 레이어 유무 확인</text>
<line x1="290" y1="245.0" x2="308" y2="245.0" stroke="#111111" stroke-width="1.2" marker-end="url(#ah)"/>
<rect x="310" y="150" width="228" height="190" stroke="#111111" fill="none" stroke-width="1"/>
<text x="324" y="180" font-size="22" font-weight="700" fill="#111111" text-anchor="start">1</text>
<text x="350" y="180" font-size="17" font-weight="600" fill="#111111" text-anchor="start">전체 기본 추출</text>
<line x1="324" y1="192" x2="524" y2="192" stroke="#B5B5B5" stroke-width="1"/>
<text x="324" y="216" font-size="13.5" font-weight="400" fill="#111111" text-anchor="start">모든 페이지 대상</text>
<text x="324" y="237" font-size="13.5" font-weight="400" fill="#111111" text-anchor="start">디지털: CPU 파서로 텍스트, 셀, 좌표</text>
<text x="324" y="258" font-size="13.5" font-weight="400" fill="#111111" text-anchor="start">도면: 벡터 객체와 좌표</text>
<text x="324" y="279" font-size="13.5" font-weight="400" fill="#111111" text-anchor="start">스캔: 기본 OCR, 도형과 선과 원 검출</text>
<line x1="324" y1="304" x2="524" y2="304" stroke="#B5B5B5" stroke-width="1"/>
<text x="324" y="324" font-size="12.5" font-weight="400" fill="#6B6B6B" text-anchor="start">저비용 처리, GPU 불필요</text>
<line x1="540" y1="245.0" x2="558" y2="245.0" stroke="#111111" stroke-width="1.2" marker-end="url(#ah)"/>
<rect x="560" y="150" width="228" height="190" stroke="#111111" fill="none" stroke-width="1"/>
<text x="574" y="180" font-size="22" font-weight="700" fill="#111111" text-anchor="start">2</text>
<text x="600" y="180" font-size="17" font-weight="600" fill="#111111" text-anchor="start">구조화와 관계 점검</text>
<line x1="574" y1="192" x2="774" y2="192" stroke="#B5B5B5" stroke-width="1"/>
<text x="574" y="216" font-size="13.5" font-weight="400" fill="#111111" text-anchor="start">항목: 대상, 속성 또는 관계, 값,</text>
<text x="574" y="237" font-size="13.5" font-weight="400" fill="#111111" text-anchor="start">적용 조건, 출처(영역, 셀, 각주 단위)</text>
<text x="574" y="258" font-size="13.5" font-weight="400" fill="#111111" text-anchor="start">점검: 각주 기호, 그림과 표의 대응,</text>
<text x="574" y="279" font-size="13.5" font-weight="400" fill="#111111" text-anchor="start">식별자 대조, 값 충돌</text>
<line x1="574" y1="304" x2="774" y2="304" stroke="#B5B5B5" stroke-width="1"/>
<text x="574" y="324" font-size="12.5" font-weight="400" fill="#6B6B6B" text-anchor="start">문제 영역 목록 산출</text>
<line x1="790" y1="245.0" x2="808" y2="245.0" stroke="#111111" stroke-width="1.2" marker-end="url(#ah)"/>
