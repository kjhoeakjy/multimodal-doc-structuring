<text x="1324" y="216" font-size="13.5" font-weight="400" fill="#111111" text-anchor="start">대상과 조건이 일치하는 항목 조회</text>
<text x="1324" y="237" font-size="13.5" font-weight="400" fill="#111111" text-anchor="start">조건 미지정: 조건별 값 병기</text>
<text x="1324" y="258" font-size="13.5" font-weight="400" fill="#111111" text-anchor="start">기록 없는 조건: 기준 부재 전달</text>
<text x="1324" y="279" font-size="13.5" font-weight="400" fill="#111111" text-anchor="start">소형 로컬 LLM에 값, 조건, 출처 입력</text>
<line x1="1324" y1="304" x2="1524" y2="304" stroke="#B5B5B5" stroke-width="1"/>
<text x="1324" y="324" font-size="12.5" font-weight="400" fill="#6B6B6B" text-anchor="start">질의당 입력 토큰 최소화</text>
