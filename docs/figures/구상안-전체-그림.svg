<text x="824" y="258" font-size="13.5" font-weight="400" fill="#111111" text-anchor="start">소형 시각언어모델(VLM) 재해석</text>
<text x="824" y="279" font-size="13.5" font-weight="400" fill="#111111" text-anchor="start">결과를 2단계에 재투입</text>
<line x1="824" y1="304" x2="1024" y2="304" stroke="#B5B5B5" stroke-width="1"/>
<text x="824" y="324" font-size="12.5" font-weight="400" fill="#6B6B6B" text-anchor="start">추가 분석 영역 수, 미해결 연결 수 측정</text>
<line x1="1040" y1="245.0" x2="1058" y2="245.0" stroke="#111111" stroke-width="1.2" marker-end="url(#ah)"/>
<rect x="1060" y="150" width="228" height="190" stroke="#111111" fill="none" stroke-width="1"/>
<text x="1074" y="180" font-size="22" font-weight="700" fill="#111111" text-anchor="start">4</text>
<text x="1100" y="180" font-size="17" font-weight="600" fill="#111111" text-anchor="start">저장</text>
<line x1="1074" y1="192" x2="1274" y2="192" stroke="#B5B5B5" stroke-width="1"/>
<text x="1074" y="216" font-size="13.5" font-weight="400" fill="#111111" text-anchor="start">적용 조건과 출처를 함께 보존</text>
<text x="1074" y="237" font-size="13.5" font-weight="400" fill="#111111" text-anchor="start">조건별 값은 각각 보존</text>
<text x="1074" y="258" font-size="13.5" font-weight="400" fill="#111111" text-anchor="start">미확정 관계는 원본과 함께 보류</text>
<text x="1074" y="279" font-size="13.5" font-weight="400" fill="#111111" text-anchor="start">문서 등록 시 1회 처리 후 재사용</text>
<line x1="1074" y1="304" x2="1274" y2="304" stroke="#B5B5B5" stroke-width="1"/>
<text x="1074" y="324" font-size="12.5" font-weight="400" fill="#6B6B6B" text-anchor="start">이후 질의에서 재처리 없음</text>
<line x1="1290" y1="245.0" x2="1308" y2="245.0" stroke="#111111" stroke-width="1.2" marker-end="url(#ah)"/>
<rect x="1310" y="150" width="228" height="190" stroke="#111111" fill="none" stroke-width="1"/>
