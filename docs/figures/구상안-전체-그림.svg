<text x="184" y="510" font-size="10" font-weight="600" fill="#1F4FD8" text-anchor="middle">7</text>
<text x="60" y="578" font-size="12" font-weight="400" fill="#6B6B6B" text-anchor="start">체결부 3은 HV-202 상자 안에 위치</text>
<text x="260" y="454" font-size="13.5" font-weight="600" fill="#111111" text-anchor="start">표 1 체결부 토크</text>
<text x="260" y="482" font-size="12" font-weight="600" fill="#111111" text-anchor="start">항목</text>
<text x="318" y="482" font-size="12" font-weight="600" fill="#111111" text-anchor="start">규격</text>
<text x="376" y="482" font-size="12" font-weight="600" fill="#111111" text-anchor="start">토크(N·m)</text>
<line x1="260" y1="488" x2="430" y2="488" stroke="#111111" stroke-width="1"/>
<text x="260" y="502" font-size="12" font-weight="400" fill="#111111" text-anchor="start">1</text>
<text x="318" y="502" font-size="12" font-weight="400" fill="#111111" text-anchor="start">M6</text>
<text x="376" y="502" font-size="12" font-weight="400" fill="#111111" text-anchor="start">10 *</text>
<line x1="260" y1="508" x2="430" y2="508" stroke="#B5B5B5" stroke-width="1"/>
<text x="260" y="522" font-size="12" font-weight="400" fill="#111111" text-anchor="start">2</text>
<text x="318" y="522" font-size="12" font-weight="400" fill="#111111" text-anchor="start">M10</text>
<text x="376" y="522" font-size="12" font-weight="400" fill="#111111" text-anchor="start">48 *</text>
<line x1="260" y1="528" x2="430" y2="528" stroke="#B5B5B5" stroke-width="1"/>
<text x="260" y="542" font-size="12" font-weight="400" fill="#111111" text-anchor="start">3</text>
<text x="318" y="542" font-size="12" font-weight="400" fill="#111111" text-anchor="start">M8</text>
<text x="376" y="542" font-size="12" font-weight="400" fill="#111111" text-anchor="start">25 *</text>
<line x1="260" y1="548" x2="430" y2="548" stroke="#B5B5B5" stroke-width="1"/>
<text x="260" y="578" font-size="12" font-weight="400" fill="#6B6B6B" text-anchor="start">각주  * 건식 기준. 윤활 시 M8 20 N·m</text>
<line x1="450" y1="520" x2="486" y2="520" stroke="#111111" stroke-width="1.2" marker-end="url(#ah)"/>
<text x="496" y="454" font-size="13.5" font-weight="600" fill="#111111" text-anchor="start">구조화 항목</text>
