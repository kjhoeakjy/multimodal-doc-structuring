<text x="74" y="180" font-size="17" font-weight="600" fill="#111111" text-anchor="start">입력</text>
<line x1="74" y1="192" x2="274" y2="192" stroke="#B5B5B5" stroke-width="1"/>
<text x="74" y="216" font-size="13.5" font-weight="400" fill="#111111" text-anchor="start">PDF, 스캔 기술문서</text>
<text x="74" y="237" font-size="13.5" font-weight="400" fill="#111111" text-anchor="start">표, 그림, 각주, 주의문, 일반 주기</text>
<line x1="74" y1="304" x2="274" y2="304" stroke="#B5B5B5" stroke-width="1"/>
<text x="74" y="324" font-size="12.5" font-weight="400" fill="#6B6B6B" text-anchor="start">텍스트 레이어 유무 확인</text>
<line x1="290" y1="245.0" x2="308" y2="245.0" stroke="#111111" stroke-width="1.2" marker-end="url(#ah)"/>
<rect x="310" y="150" width="228" height="190" stroke="#111111" fill="none" stroke-width="1"/>
<text x="324" y="180" font-size="22" font-weight="700" fill="#111111" text-anchor="start">1</text>
<text x="350" y="180" font-size="17" font-weight="600" fill="#111111" text-anchor="start">전체 기본 추출</text>
<line x1="324" y1="192" x2="524" y2="192" stroke="#B5B5B5" stroke-width="1"/>
<text x="324" y="216" font-size="13.5" font-weight="400" fill="#111111" text-anchor="start">모든 페이지 대상</text>
<text x="324" y="237" font-size="13.5" font-weight="400" fill="#111111" text-anchor="start">디지털: CPU 파서로 텍스트, 셀, 좌표</text>
<text x="324" y="258" font-size="13.5" font-weight="400" fill="#111111" text-anchor="start">도면: 벡터 객체와 좌표</text>
<text x="324" y="279" font-size="13.5" font-weight="400" fill="#111111" text-anchor="start">스캔: 기본 OCR, 도형과 선과 원 검출</text>
<line x1="324" y1="304" x2="524" y2="304" stroke="#B5B5B5" stroke-width="1"/>
<text x="324" y="324" font-size="12.5" font-weight="400" fill="#6B6B6B" text-anchor="start">저비용 처리, GPU 불필요</text>
<line x1="540" y1="245.0" x2="558" y2="245.0" stroke="#111111" stroke-width="1.2" marker-end="url(#ah)"/>
<rect x="560" y="150" width="228" height="190" stroke="#111111" fill="none" stroke-width="1"/>
<text x="574" y="180" font-size="22" font-weight="700" fill="#111111" text-anchor="start">2</text>
<text x="600" y="180" font-size="17" font-weight="600" fill="#111111" text-anchor="start">상속과 완결성 점검</text>
<line x1="574" y1="192" x2="774" y2="192" stroke="#B5B5B5" stroke-width="1"/>
<text x="574" y="216" font-size="13.5" font-weight="400" fill="#111111" text-anchor="start">적용 범위 상속: 주의문, 머리글,</text>
<text x="574" y="237" font-size="13.5" font-weight="400" fill="#111111" text-anchor="start">계열 행, 셀, 각주 순으로 조건 결합</text>
<text x="574" y="258" font-size="13.5" font-weight="400" fill="#111111" text-anchor="start">참조 완결성 점검: 각주 기호, 열 수,</text>
<text x="574" y="279" font-size="13.5" font-weight="400" fill="#111111" text-anchor="start">공차 기호 문법, 식별자, 단위</text>
<line x1="574" y1="304" x2="774" y2="304" stroke="#B5B5B5" stroke-width="1"/>
<text x="574" y="324" font-size="12.5" font-weight="400" fill="#6B6B6B" text-anchor="start">위반 영역 목록 산출</text>
<line x1="790" y1="245.0" x2="808" y2="245.0" stroke="#111111" stroke-width="1.2" marker-end="url(#ah)"/>
<rect x="810" y="150" width="228" height="190" stroke="#111111" fill="none" stroke-width="1"/>
<text x="824" y="180" font-size="22" font-weight="700" fill="#1F4FD8" text-anchor="start">3</text>
<text x="850" y="180" font-size="17" font-weight="600" fill="#111111" text-anchor="start">선택적 재추출</text>
<line x1="824" y1="192" x2="1024" y2="192" stroke="#B5B5B5" stroke-width="1"/>
<text x="824" y="216" font-size="13.5" font-weight="400" fill="#111111" text-anchor="start">위반 영역에 한정, 횟수 제한</text>
<text x="824" y="237" font-size="13.5" font-weight="400" fill="#111111" text-anchor="start">고해상도 재처리 뒤</text>
<text x="824" y="258" font-size="13.5" font-weight="400" fill="#111111" text-anchor="start">소형 시각언어모델(VLM) 재추출</text>
<text x="824" y="279" font-size="13.5" font-weight="400" fill="#111111" text-anchor="start">1차 추출과 대조해 환각 기각</text>
<line x1="824" y1="304" x2="1024" y2="304" stroke="#B5B5B5" stroke-width="1"/>
<text x="824" y="324" font-size="12.5" font-weight="400" fill="#6B6B6B" text-anchor="start">재추출 영역 수, 미해결 참조 수 측정</text>
<line x1="1040" y1="245.0" x2="1058" y2="245.0" stroke="#111111" stroke-width="1.2" marker-end="url(#ah)"/>
<rect x="1060" y="150" width="228" height="190" stroke="#111111" fill="none" stroke-width="1"/>
<text x="1074" y="180" font-size="22" font-weight="700" fill="#111111" text-anchor="start">4</text>
<text x="1100" y="180" font-size="17" font-weight="600" fill="#111111" text-anchor="start">저장</text>
<line x1="1074" y1="192" x2="1274" y2="192" stroke="#B5B5B5" stroke-width="1"/>
<text x="1074" y="216" font-size="13.5" font-weight="400" fill="#111111" text-anchor="start">대상, 속성, 값, 적용 범위, 출처</text>
<text x="1074" y="237" font-size="13.5" font-weight="400" fill="#111111" text-anchor="start">범위가 다른 값은 각각 보존</text>
<text x="1074" y="258" font-size="13.5" font-weight="400" fill="#111111" text-anchor="start">미확정 참조는 원본과 함께 보류</text>
<text x="1074" y="279" font-size="13.5" font-weight="400" fill="#111111" text-anchor="start">문서 등록 시 1회 처리 후 재사용</text>
<line x1="1074" y1="304" x2="1274" y2="304" stroke="#B5B5B5" stroke-width="1"/>
<text x="1074" y="324" font-size="12.5" font-weight="400" fill="#6B6B6B" text-anchor="start">이후 질의에서 재처리 없음</text>
<line x1="1290" y1="245.0" x2="1308" y2="245.0" stroke="#111111" stroke-width="1.2" marker-end="url(#ah)"/>
<rect x="1310" y="150" width="228" height="190" stroke="#111111" fill="none" stroke-width="1"/>
<text x="1324" y="180" font-size="22" font-weight="700" fill="#111111" text-anchor="start">5</text>
<text x="1350" y="180" font-size="17" font-weight="600" fill="#111111" text-anchor="start">범위 일치 전달</text>
<line x1="1324" y1="192" x2="1524" y2="192" stroke="#B5B5B5" stroke-width="1"/>
<text x="1324" y="216" font-size="13.5" font-weight="400" fill="#111111" text-anchor="start">질문 조건과 적용 범위가 일치하는 항목</text>
<text x="1324" y="237" font-size="13.5" font-weight="400" fill="#111111" text-anchor="start">조건 미지정: 범위별 값 병기</text>
<text x="1324" y="258" font-size="13.5" font-weight="400" fill="#111111" text-anchor="start">기록 없는 조건: 범위를 밝히고 보류</text>
<text x="1324" y="279" font-size="13.5" font-weight="400" fill="#111111" text-anchor="start">수치는 저장값 그대로 로컬 LLM에 입력</text>
<line x1="1324" y1="304" x2="1524" y2="304" stroke="#B5B5B5" stroke-width="1"/>
<text x="1324" y="324" font-size="12.5" font-weight="400" fill="#6B6B6B" text-anchor="start">질의당 입력 토큰 최소화</text>
<line x1="924.0" y1="340" x2="924.0" y2="358" stroke="#1F4FD8" stroke-width="1.2"/>
