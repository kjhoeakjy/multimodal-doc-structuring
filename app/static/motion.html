:root{--ink:#111;--mute:#6b6b6b;--line:#d9dbe0;--soft:#f4f5f7;--bg:#fff;--acc:#1f4fd8;--txt:#5aa9e6;
 --eq:#d7263d;--ins:#7b2cbf;--sym:#1f4fd8;--pipe:#1b8a3a;--sig:#2f80ed;--jct:#e3a008;--tbl:#8a8f98;--fig:#e07a1f;
 --mono:ui-monospace,"SF Mono",Consolas,"D2Coding",monospace}
*{box-sizing:border-box}
html,body{margin:0;height:100vh;overflow:hidden;background:var(--bg);color:var(--ink);font:14px/1.5 "Wanted Sans","Malgun Gothic",sans-serif;letter-spacing:-.01em}
body{display:flex;flex-direction:column}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
header{display:flex;align-items:baseline;justify-content:space-between;gap:16px;padding:16px 24px;border-bottom:1px solid var(--ink)}
header h1{font-size:18px;font-weight:600;margin:0;letter-spacing:-.02em}
header .meta{font-size:12.5px;color:var(--mute)}
nav.tabs{display:flex;overflow-x:auto;border-bottom:1px solid var(--line);padding:0 16px}
nav.tabs button{flex:0 0 auto;padding:12px 10px 10px;border-bottom:2px solid transparent;text-align:left;line-height:1.25;color:var(--mute)}
nav.tabs button b{display:block;font-weight:500;font-size:13.5px;color:var(--ink)}
nav.tabs button span{font-size:11px}
nav.tabs button.on{border-bottom-color:var(--ink)}
nav.tabs button.on b{font-weight:600}
main{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1.15fr) minmax(420px,1fr)}
.col{padding:14px 24px;min-width:0;min-height:0;display:flex;flex-direction:column}
.col+.col{border-left:1px solid var(--line)}
.stage{border:1px solid var(--line);background:#fff;flex:1;min-height:0;position:relative}
.stage svg{display:block;width:100%;height:100%}
.stage image{}
.cap{display:flex;justify-content:space-between;font-size:12px;color:var(--mute);margin-top:8px}
.cap b{color:var(--ink);font-weight:500}
.head{display:flex;align-items:baseline;gap:12px}
.head .no{font-family:var(--mono);font-size:12px;color:var(--mute);white-space:nowrap}
.head h2{font-size:17px;font-weight:600;margin:0;letter-spacing:-.02em}
.desc{font-size:12.5px;color:var(--mute);margin:4px 0 8px}
.bar{height:2px;background:var(--line);margin:0 0 12px;position:relative}
.bar i{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--ink)}
.out{flex:1;min-height:0;font-family:var(--mono);font-size:11.5px;line-height:1.5;background:var(--soft);padding:12px 14px;overflow:auto;white-space:pre-wrap;word-break:break-all;border:1px solid transparent}
.out.llm{border-color:var(--ink)}
.out .ln{opacity:0}
.out .ln.on{opacity:1}
.out .hd{color:var(--acc);font-weight:600;margin-top:8px}
.out .hd:first-child{margin-top:0}
.out .t0{font-weight:600}
.note{font-size:12px;color:var(--mute);margin:6px 0 0;min-height:18px}
.rail{display:flex;align-items:center;gap:6px;padding:10px 24px;border-top:1px solid var(--line);flex-wrap:wrap}
.rail .ctl{display:flex;gap:4px;margin-right:10px}
.rail .ctl button{width:30px;height:30px;border:1px solid var(--ink);display:inline-flex;align-items:center;justify-content:center;font-size:12px}
.rail .ctl button.play{background:var(--ink);color:var(--bg)}
.rail .st{font-size:12.5px;padding:5px 10px;border:1px solid var(--line);color:var(--mute);line-height:1.2}
.rail .st.on{border-color:var(--ink);color:var(--bg);background:var(--ink)}
.rail .st.done{color:var(--ink)}
.rail .st em{font-style:normal;font-family:var(--mono);font-size:10.5px;margin-right:5px;opacity:.7}
.prompt{position:absolute;left:8%;right:8%;top:10%;background:var(--bg);border:1px solid var(--ink);padding:18px 20px;font-size:12.5px;line-height:1.55}
.prompt h3{margin:0 0 10px;font-size:13px;font-weight:600;letter-spacing:.02em}
.prompt .blk{border-top:1px solid var(--line);padding:8px 0}
.prompt .blk b{display:block;font-size:11px;color:var(--mute);font-weight:500;margin-bottom:3px}
.prompt pre{margin:0;font-family:var(--mono);font-size:11px;line-height:1.5;white-space:pre-wrap;word-break:break-all;color:var(--ink)}
.prompt .ans{color:var(--acc);font-weight:600}
.foot{padding:8px 24px;border-top:1px solid var(--line);font-size:11.5px;color:var(--mute)}
@media (max-width:980px){html,body{height:auto;overflow:auto}main{grid-template-columns:1fr}.col+.col{border-left:0;border-top:1px solid var(--line)}.stage svg{height:auto;max-height:60vh}.out{min-height:40vh}}
</style>
</head>
<body>
<header>
  <h1>데이터 처리 과정 시뮬레이터</h1>
  <div class="meta" id="meta"></div>
</header>
<nav class="tabs" id="tabs"></nav>
<main>
  <section class="col">
    <div class="stage"><svg id="svg" xmlns="http://www.w3.org/2000/svg"></svg></div>
    <div class="cap"><span id="capL"></span><span id="capR"></span></div>
  </section>
  <section class="col">
    <div class="head"><span class="no" id="no"></span><h2 id="title"></h2></div>
    <div class="desc" id="desc"></div>
    <div class="bar"><i id="bar"></i></div>
    <div class="out" id="out"></div>
    <div class="note" id="note"></div>
  </section>
</main>
<div class="rail" id="rail"></div>
<div class="foot">동일 유형 요소의 일괄 강조 및 요소별 텍스트 1줄 추가. 오른쪽 텍스트는 텍스트 LLM의 입력 자료. 표본 처리 결과 기반.</div>
<script>
const DATA=/*__DATA__*/[];
const NS='http://www.w3.org/2000/svg';
const $=s=>document.querySelector(s);
const RC={equipment:'#d7263d',instrument:'#7b2cbf',symbol:'#1f4fd8',note:'#7b2cbf',table:'#8a8f98',row:'#5aa9e6',figure:'#e07a1f',part:'#e07a1f',paragraph:'#6b6b6b',
  dimension:'#1f4fd8',callout:'#7b2cbf',datum:'#d7263d',photo:'#e07a1f',pipe:'#1b8a3a',signal:'#2f80ed',point:'#1b8a3a',describe:'#e07a1f',mention:'#e07a1f',belong:'#8a8f98',contain:'#8a8f98',next:'#9aa0a8'};
const ACC='#1f4fd8',TXT='#5aa9e6';
let ei=0,ai=0,playing=true,run=0,ex=null,stages=[];
const sleep=(ms)=>new Promise(r=>setTimeout(r,ms));
const esc=(t)=>String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;');
function el(t,a,p){const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);if(p)p.appendChild(e);return e;}

/* 화면 구성 */
function tabs(){
  const t=$('#tabs');t.innerHTML='';
  DATA.forEach((d,i)=>{const b=document.createElement('button');b.innerHTML=`<b>${d.kind_name}</b><span>${d.source}</span>`;b.className=i===ei?'on':'';b.onclick=()=>load(i,0);t.appendChild(b);});
}
function rail(){
  const r=$('#rail');r.innerHTML='';
  const c=document.createElement('div');c.className='ctl';
  const mk=(txt,cls,fn)=>{const b=document.createElement('button');b.textContent=txt;b.className=cls||'';b.onclick=fn;c.appendChild(b);};
  mk('‹','',()=>jump(-1));mk(playing?'❚❚':'▶',playing?'play':'',()=>{playing=!playing;rail();if(playing)loop();});mk('›','',()=>jump(1));
  r.appendChild(c);
  const cur=stageAt(ai);
  stages.forEach((s,i)=>{const b=document.createElement('button');b.className='st'+(i===cur?' on':i<cur?' done':'');b.innerHTML=`<em>${String(i+1).padStart(2,'0')}</em>${ex.acts[s].title}`;b.onclick=()=>load(ei,s);r.appendChild(b);});
}
function stageAt(i){let c=-1;for(let s=0;s<stages.length;s++){if(stages[s]<=i)c=s;}return c;}
function jump(d){
  const c=stageAt(ai)+d;
  if(c>=stages.length){load((ei+1)%DATA.length,0);return;}
  if(c<0){load((ei-1+DATA.length)%DATA.length,0);return;}
  load(ei,stages[c]);
}
function setHead(){
  const s=stageAt(ai),st=s>=0?ex.acts[stages[s]]:null;
  $('#no').textContent=`${String(s+1).padStart(2,'0')} / ${String(stages.length).padStart(2,'0')}`;
  $('#title').textContent=st?st.title:'';$('#desc').textContent=st?st.desc:'';
  $('#bar').style.width=(100*ai/Math.max(1,ex.acts.length))+'%';
  const a=ex.acts[Math.min(ai,ex.acts.length-1)];
  $('#note').textContent=s>=2||ai>=ex.acts.length?`직렬화 ${ex.nlines}줄, ${ex.nchars.toLocaleString()}자, 텍스트 LLM 입력 자료`:(a&&a.kind==='batch'?a.label:'');
}

/* 그림 위 표시 */
function grow(b,minS){const w=b[2]-b[0],h=b[3]-b[1];if(w>=minS&&h>=minS)return b;const cx=(b[0]+b[2])/2,cy=(b[1]+b[3])/2,W=Math.max(w,minS),H=Math.max(h,minS);return [cx-W/2,cy-H/2,cx+W/2,cy+H/2];}
function markItem(it,g,strong){
  const base=Math.max(ex.w,ex.h)/800,c=strong?ACC:(RC[it.cls]||ACC);
  if(it.kind==='box'||it.kind==='group'){
    const boxes=it.kind==='group'?it.boxes:[it.box];
    boxes.forEach(bb=>{const b=strong?grow(bb,12*base):bb;el('rect',{x:b[0],y:b[1],width:Math.max(1,b[2]-b[0]),height:Math.max(1,b[3]-b[1]),fill:strong?c+'14':'none',stroke:c,'stroke-width':(strong?2.2:1.1)*base,'stroke-dasharray':it.cls==='paragraph'?`${5*base} ${3*base}`:''},g);});
    if(strong&&it.sub){it.sub.forEach(s=>el('rect',{x:s.box[0],y:s.box[1],width:Math.max(1,s.box[2]-s.box[0]),height:Math.max(1,s.box[3]-s.box[1]),fill:TXT+'33',stroke:TXT,'stroke-width':1.1*base},g));}
  }else if(it.kind==='poly'){
    const p=el('polyline',{points:it.pts.map(q=>q.join(',')).join(' '),fill:'none',stroke:c,'stroke-width':(strong?3:1.8)*base,'stroke-linecap':'round','stroke-linejoin':'round','stroke-dasharray':it.cls==='signal'&&!strong?`${5*base} ${3*base}`:''},g);
    if(strong){
      (it.ends||[]).forEach(b=>el('rect',{x:b[0],y:b[1],width:b[2]-b[0],height:b[3]-b[1],fill:'none',stroke:ACC,'stroke-width':1.3*base,'stroke-dasharray':`${3*base} ${2*base}`},g));
      (it.sub||[]).forEach(s=>el('rect',{x:s.box[0],y:s.box[1],width:Math.max(1,s.box[2]-s.box[0]),height:Math.max(1,s.box[3]-s.box[1]),fill:TXT+'33',stroke:TXT,'stroke-width':1.1*base},g));}
  }
}
function markSweep(a,g,strong){
  const base=Math.max(ex.w,ex.h)/800,sc={text:TXT,shape:ACC,line:'#1b8a3a',table:'#8a8f98',part:'#e07a1f'}[a.cls]||ACC,o=strong?1:.4;
  return (a.items||[]).map(b=>el('rect',{x:b[0],y:b[1],width:Math.max(1,b[2]-b[0]),height:Math.max(1,b[3]-b[1]),fill:'none',stroke:sc,'stroke-width':(a.cls==='text'?.8:1.3)*base,opacity:o},g))
    .concat((a.lines||[]).map(pts=>el('polyline',{points:pts.map(q=>q.join(',')).join(' '),fill:'none',stroke:sc,'stroke-width':1.6*base,'stroke-linecap':'round',opacity:o},g)));
}
function settle(a){
  const done=$('#done');$('#hi').innerHTML='';
  if(a.kind==='sweep')markSweep(a,done,false);
  else if(a.kind==='extract')a.groups.forEach(g=>markSweep(g,done,false));
  else if(a.kind==='batch')a.items.forEach(it=>markItem(it,done,false));
}

/* 오른쪽 텍스트 */
function addLine(text,on){
  const out=$('#out'),d=document.createElement('div');
  d.className=text.startsWith('#')?'hd ln':'ln';d.textContent=text;
  if(on)d.classList.add('on');
  out.appendChild(d);return d;
}
function linesOf(a){
  if(a.kind==='batch')return (a.header?[a.header]:[]).concat(a.items.map(it=>it.line));
  if(a.kind==='extract')return a.lines;
  if(a.kind==='stage'||a.kind==='final')return [];
  return [a.line];
}

/* 재생 */
function load(i,at){
  run++;ei=i;ex=DATA[i];stages=[];ex.acts.forEach((a,j)=>{if(a.kind==='stage')stages.push(j);});
  const svg=$('#svg');svg.innerHTML='';svg.setAttribute('viewBox',`0 0 ${ex.w} ${ex.h}`);
  el('image',{href:ex.img,x:0,y:0,width:ex.w,height:ex.h,preserveAspectRatio:'none'},svg);
  el('g',{id:'done'},svg);el('g',{id:'hi',class:'hi'},svg);
  $('#out').innerHTML='';$('#out').classList.remove('llm');const pc=$('.prompt');if(pc)pc.remove();
  $('#meta').textContent=`${DATA.length}종 · ${ex.kind_name} · ${ex.source}`;
  $('#capL').innerHTML=`<b>${ex.name}</b> · ${ex.w}×${ex.h} px`;
  $('#capR').textContent=ex.total?`처리 ${ex.total}초`:'';
  ai=0;
  while(ai<at){const a=ex.acts[ai];linesOf(a).forEach(t=>addLine(t,true));settle(a);ai++;}
  $('#out').scrollTop=$('#out').scrollHeight;
  tabs();rail();setHead();
  loop();
}
async function loop(){
  const my=++run;
  while(playing&&ai<ex.acts.length){
    const a=ex.acts[ai];
    await play(a,my);
    if(my!==run)return;
    ai++;setHead();
    if(a.kind==='stage'||ex.acts[ai]&&ex.acts[ai].kind==='stage')rail();
  }
  if(my!==run)return;
  if(playing&&ai>=ex.acts.length){await sleep(1500);if(my===run&&playing)load((ei+1)%DATA.length,0);}
}
async function reveal(texts,my,hold){
  const out=$('#out'),ds=texts.map(t=>addLine(t,true));
  if(ds.length){const first=ds[0],last=ds[ds.length-1],h=last.offsetTop+last.offsetHeight-first.offsetTop;
    out.scrollTop=h>out.clientHeight-20?Math.max(0,first.offsetTop-12):Math.max(0,last.offsetTop+last.offsetHeight-out.clientHeight+14);}
  await sleep(hold);
}
async function play(a,my){
  const out=$('#out'),hi=$('#hi');
  if(a.kind==='stage'){rail();setHead();await sleep(700);return;}
  if(a.kind==='final'){
    out.classList.add('llm');out.scrollTop=0;
    const img=$('#svg image');img.style.opacity=.15;
    const card=document.createElement('div');card.className='prompt';
    card.innerHTML=`<h3>텍스트 LLM 프롬프트</h3>
      <div class="blk"><b>문서 (직렬화 텍스트 ${a.nlines}줄, ${a.nchars.toLocaleString()}자 전체)</b><pre>${a.head.map(esc).join('\n')}\n…</pre></div>
      ${a.q?`<div class="blk"><b>질문</b><pre>${esc(a.q)}</pre></div><div class="blk"><b>답 (텍스트 내 근거 줄)</b><pre class="ans">${esc(a.a)}</pre></div>`:''}`;
    $('.stage').appendChild(card);
    await sleep(6000);return;
  }
  if(a.kind==='extract'){
    a.groups.forEach(g=>markSweep(g,hi,true));
    await reveal(a.lines,my,3500);if(my!==run)return;
    settle(a);return;
  }
  if(a.kind==='text'){await reveal([a.line],my,1500);return;}
  hi.innerHTML='';
  if(a.kind==='sweep'){
    markSweep(a,hi,true);
    await reveal([a.line],my,1500);if(my!==run)return;
    settle(a);return;
  }
  if(a.kind==='batch'){
    a.items.forEach(it=>markItem(it,hi,true));
    await reveal(linesOf(a),my,Math.min(6000,1800+a.items.length*120));if(my!==run)return;
    settle(a);
  }
}
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')jump(1);else if(e.key==='ArrowLeft')jump(-1);else if(e.key===' '){e.preventDefault();playing=!playing;rail();if(playing)loop();}});
if(DATA.length)load(0,0);
</script>
</body>
</html>
