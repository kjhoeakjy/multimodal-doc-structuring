<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>문서 구조화</title>
<style>
:root{--ink:#111;--mute:#6b6b6b;--line:#d9dbe0;--soft:#f4f5f7;--bg:#fff;--acc:#1f4fd8;--eq:#d7263d;--ins:#7b2cbf;--sym:#1f4fd8;--pipe:#1b8a3a;--sig:#2f80ed;--jct:#e3a008;--tbl:#8a8f98;--txt:#5aa9e6;--fig:#e07a1f;
 --mono:ui-monospace,"SF Mono",Consolas,"D2Coding",monospace}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--ink:#ededed;--mute:#9a9a9a;--line:#333;--soft:#1b1b1b;--bg:#111;--acc:#6f8fff}}
:root[data-theme="dark"]{--ink:#ededed;--mute:#9a9a9a;--line:#333;--soft:#1b1b1b;--bg:#111;--acc:#6f8fff}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 "Pretendard","Pretendard Variable","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;letter-spacing:-.01em}
button,input,select{font:inherit;color:inherit}
header{display:flex;align-items:baseline;justify-content:space-between;gap:16px;padding:16px 24px;border-bottom:1px solid var(--ink)}
header h1{font-size:18px;font-weight:600;margin:0;letter-spacing:-.02em}
header .meta{font-size:12.5px;color:var(--mute)}
header .meta b{color:var(--ink);font-weight:600}
h2{font-size:12px;font-weight:600;color:var(--mute);letter-spacing:.04em;margin:0 0 10px}
.gallery{display:flex;gap:10px;overflow-x:auto;padding:12px 24px 14px;border-bottom:1px solid var(--line)}
.gallery .card{flex:0 0 140px;border:1px solid var(--line);cursor:pointer;background:var(--bg)}
.gallery .card.on{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.gallery .card img{display:block;width:138px;height:92px;object-fit:cover;object-position:top;background:#fff}
.gallery .card div{padding:5px 7px;font-size:11px;line-height:1.3;color:var(--mute);border-top:1px solid var(--line)}
.gallery .card div b{display:block;color:var(--ink);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
main{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(360px,1fr)}
.col{padding:16px 24px;min-width:0}
.col+.col{border-left:1px solid var(--line)}
.row{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--line)}
.row .col+.col{border-left:1px solid var(--line)}
.kv{font-size:13px;color:var(--mute);margin-bottom:10px}
.kv b{color:var(--ink);font-weight:500}
.tools{display:flex;gap:6px;align-items:center;margin-bottom:8px;font-size:12px}
.tools .lg{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);padding:3px 8px;cursor:pointer;user-select:none;color:var(--mute)}
.tools .lg.on{color:var(--ink);border-color:var(--ink)}
.tools .lg i{width:9px;height:9px;display:inline-block}
.tools .sp{flex:1}
.canvas{overflow:auto;background:var(--soft);border:1px solid var(--line);max-height:72vh}
.canvas svg{display:block;background:#fff;margin:0 auto}
.layer{display:none}.layer.on{display:block}
.ov-text rect{fill:none;stroke:var(--txt);stroke-width:1}
.ov-node rect{fill:none;stroke-width:1.6}
.ov-node .equipment{stroke:var(--eq)} .ov-node .instrument{stroke:var(--ins)} .ov-node .symbol,.ov-node .nozzle,.ov-node .shape{stroke:var(--sym)} .ov-node .note{stroke:var(--ins);stroke-dasharray:4 3} .ov-node .mark,.ov-node .arrow{stroke:var(--sym);stroke-width:.8}
.ov-node .table{stroke:var(--tbl)} .ov-node .row{stroke:var(--txt);stroke-width:.8} .ov-node .figure,.ov-node .part,.ov-node .photo{stroke:var(--fig)} .ov-node .paragraph{stroke:var(--mute);stroke-dasharray:5 3} .ov-node .callout,.ov-node .dimension,.ov-node .datum{stroke:var(--ins)} .ov-node .text{stroke:var(--txt);stroke-width:.8}
.ov-run polyline{fill:none;stroke:#8a8f98;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round} .ov-run .pipe,.ov-run .signal{stroke-width:2.2} .ov-run .pipe{stroke:var(--pipe)} .ov-run .signal{stroke:var(--sig);stroke-dasharray:6 4} .ov-run .gap{stroke-dasharray:2 4} .ov-run .next{stroke-dasharray:3 5;stroke-width:1} .ov-run .describe,.ov-run .mention{stroke:var(--fig)} .ov-run .point{stroke:var(--pipe)}
.ov-jct circle{fill:var(--jct)}
.ov-hl rect,.ov-hl polyline{fill:none;stroke:var(--acc);stroke-width:3.5}
.ov-hl circle{fill:none;stroke:var(--acc);stroke-width:3}
ol.steps{margin:0 0 14px;padding-left:22px;font-size:13.5px}
ol.steps li{padding:3px 0;border-bottom:1px solid var(--line)}
ol.steps li:last-child{border-bottom:0}
pre{font-family:var(--mono);font-size:11.5px;line-height:1.5;background:var(--soft);padding:12px;margin:0;white-space:pre-wrap;word-break:break-all;max-height:46vh;overflow:auto}
pre .hl{color:var(--acc);font-weight:600}
.btn{border:1px solid var(--ink);background:var(--ink);color:var(--bg);padding:7px 12px;cursor:pointer}
.btn.ghost{background:var(--bg);color:var(--ink);padding:2px 8px;font-size:12px}
.gsvg{width:100%;height:auto;border:1px solid var(--line);background:#fff}
.gsvg .e{stroke:#aaa;stroke-width:1.2} .gsvg .pipe{stroke:var(--pipe)} .gsvg .signal{stroke:var(--sig);stroke-dasharray:4 3} .gsvg .next{stroke-dasharray:2 4} .gsvg .describe,.gsvg .mention{stroke:var(--fig)} .gsvg .point{stroke:var(--pipe)}
.gsvg text.iso{fill:var(--mute);font-size:10px} .gsvg text{font-size:9px;font-family:var(--mono);fill:#111;pointer-events:none}
.gsvg g.n{cursor:pointer}
.gsvg g.hl circle{stroke:var(--acc);stroke-width:3}
.q{display:flex;gap:8px;margin-bottom:10px}
.q input{flex:1;border:1px solid var(--line);padding:7px 10px;background:var(--bg)}
.q select{border:1px solid var(--line);background:var(--bg);padding:6px 8px}
.note{font-size:12px;color:var(--mute);margin:8px 0 0}
.foot{padding:10px 24px;border-top:1px solid var(--line);font-size:11.5px;color:var(--mute)}
@media (max-width:980px){main,.row{grid-template-columns:1fr}.col+.col{border-left:0;border-top:1px solid var(--line)}}
</style>
</head>
<body>
<header>
  <h1>문서 구조화</h1>
  <div class="meta" id="meta"></div>
</header>
<div class="gallery" id="gallery"></div>
<main>
  <section class="col">
    <h2>입력</h2>
    <div class="kv" id="detect"></div>
    <div class="tools" id="tools">
      <span class="lg on" data-l="text"><i style="background:var(--txt)"></i>문자</span>
      <span class="lg on" data-l="elem"><i style="background:var(--eq)"></i>요소</span>
      <span class="lg on" data-l="rel"><i style="background:var(--pipe)"></i>관계</span>
      <span class="sp"></span>
      <span class="lg" id="zoom">배율 1×</span>
    </div>
    <div class="canvas" id="canvas"></div>
  </section>
  <section class="col">
    <h2>전처리 과정</h2>
    <ol class="steps" id="steps"></ol>
    <div class="kv" id="time"></div>
    <h2 style="margin-top:18px">AI 입력 텍스트 <span id="scount" style="font-weight:400"></span> <button class="btn ghost" id="copy">복사</button></h2>
    <pre id="serial"></pre>
  </section>
</main>
<div class="row">
  <section class="col">
    <h2>AI 인지 구조 · 관계 그래프 <span id="gcount" style="font-weight:400"></span></h2>
    <svg class="gsvg" id="gsvg" viewBox="0 0 640 400"></svg>
    <p class="note">노드 선택 시 원본 위치 강조. 배치는 연결 관계 기준</p>
  </section>
  <section class="col">
    <h2>관계 질의 · AI에 전달되는 부분 그래프</h2>
    <div class="q"><input id="qtag" placeholder="태그 또는 노드 이름"><select id="qdepth"><option>1</option><option>2</option><option selected>3</option><option>4</option></select><button class="btn" id="qgo">조회</button></div>
    <pre id="qout"></pre>
  </section>
</div>
<div class="foot" id="foot"></div>
<script>
const SAMPLES = /*__DATA__*/[];
const $ = s => document.querySelector(s);
const ROLE = {equipment:'장비', instrument:'계기', symbol:'기호', nozzle:'접속구', note:'주석', mark:'표식', arrow:'화살표', shape:'도형', junction:'분기점', table:'표', row:'행', figure:'그림', paragraph:'문단', callout:'주기', dimension:'치수', datum:'기준 문자', part:'투상도', photo:'사진', text:'문자'};
const EDGE = {pipe:'배관', signal:'신호선', contain:'포함', belong:'소속', describe:'설명', mention:'언급', next:'순서', point:'지시', dimension:'치수'};
const KIND = {vector:'벡터 도면', drawing:'래스터 도면', page:'표 · 본문 쪽', illustration:'도해 · 기계 도면', photo:'사진 · 렌더링'};
const STEPS = {
  vector: ['벡터 요소 읽기(직선 · 곡선 · 타원 · 문자, 좌표 mm)', '틀 · 표 분리', '닫힌 도형 · 기호 묶음', '선 병합 · 접속 판정', '문자 부착 · 역할 추정', '관계 그래프 구성', '텍스트 직렬화'],
  drawing: ['기울기 보정 · 잡음 제거', '문자 인식', '축 평행 선 · 닫힌 윤곽 · 기호 추출', '틀 · 표 제거', '접속 판정 · 문자 부착 · 역할 추정', '관계 그래프 구성', '텍스트 직렬화'],
  page: ['기울기 보정', '문자 인식', '격자선 분할 · 칸별 문자 배정', '그림 영역 추출 · 행 연결', '본문 줄 · 문단 묶음', '관계 그래프 구성(표 · 행 · 그림 · 문단)', '텍스트 직렬화'],
  illustration: ['기울기 보정', '문자 인식', '틀 · 표제란 분리', '투상도 영역 추출', '치수 · 주기 묶음 · 지시선 추출', '관계 그래프 구성(투상도 · 치수 · 주기 · 표)', '텍스트 직렬화'],
  photo: ['연속 계조 판별(구조 추출 제외)', '사진 위 문자 인식', '이미지 임베딩(검색용)', '텍스트 직렬화']};
let R = null, S = null, scale = 1;
function esc(s){ return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

const gal = $('#gallery');
SAMPLES.forEach((s, i) => { const c = document.createElement('div'); c.className = 'card'; c.innerHTML = `<img src="${s.thumb}" alt=""><div><b>${esc(s.name)}</b>${KIND[s.R.kind] || s.R.kind} · ${esc(s.source)}</div>`; c.addEventListener('click', () => select(i)); gal.appendChild(c); });
function select(i){ S = SAMPLES[i]; R = S.R; document.querySelectorAll('.gallery .card').forEach((c, j) => c.classList.toggle('on', j === i)); scale = 1; $('#zoom').textContent = '배율 1×'; render(); }

$('#tools').addEventListener('click', e => { const lg = e.target.closest('.lg[data-l]'); if (!lg) return; lg.classList.toggle('on'); applyLayers(); });
function applyLayers(){ const on = l => document.querySelector(`.lg[data-l="${l}"]`).classList.contains('on'); const map = {text: ['ov-text'], elem: ['ov-node'], rel: ['ov-run', 'ov-jct']}; for (const l in map) map[l].forEach(id => { const g = document.getElementById(id); if (g) g.classList.toggle('on', on(l)); }); }
$('#zoom').addEventListener('click', () => { scale = scale >= 3 ? 1 : scale + 1; $('#zoom').textContent = `배율 ${scale}×`; fit(); });
function fit(){ const svg = $('#canvas svg'); if (!svg || !R) return; const w = $('#canvas').clientWidth - 2; const s = Math.min(1, w / R.view.w) * scale; svg.setAttribute('width', R.view.w * s); svg.setAttribute('height', R.view.h * s); }
addEventListener('resize', fit);

const px = v => v / R.view.mm_per_px;
function render(){
  const W = R.view.w, H = R.view.h; const sw = Math.max(1, W / 1400);
  const nodes = (R.nodes || []).filter(n => n.role !== 'row' && n.role !== 'text');   // 행·문자 노드는 상자 대신 문자 겹층으로 충분
  let s = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${H}"><image href="${S.img}" width="${W}" height="${H}" preserveAspectRatio="none"/>`;
  s += `<g id="ov-text" class="layer ov-text">` + (R.texts || []).map(t => `<rect x="${t.box[0]}" y="${t.box[1]}" width="${t.box[2]-t.box[0]}" height="${t.box[3]-t.box[1]}"><title>${esc(t.text)} (${t.conf})</title></rect>`).join('') + `</g>`;
  s += `<g id="ov-run" class="layer ov-run" style="stroke-width:${2.2*sw}">` + (R.runs || []).map(r => `<polyline id="ov-${r.id}" class="${r.kind}${r.gap ? ' gap' : ''}" points="${r.coords.map(c => px(c[0]) + ',' + px(c[1])).join(' ')}"><title>${r.id} ${EDGE[r.kind] || r.kind} ${r.a} ${r.b} ${esc(r.texts.join(' '))}</title></polyline>`).join('') + `</g>`;
  s += `<g id="ov-node" class="layer ov-node">` + nodes.map(n => { const b = n.bbox.map(px); return `<rect id="ov-${n.id}" class="${n.role}" x="${b[0]-2}" y="${b[1]-2}" width="${b[2]-b[0]+4}" height="${b[3]-b[1]+4}" rx="2"><title>${n.id} ${ROLE[n.role]||n.role} ${esc(n.texts.join(' '))}</title></rect>`; }).join('') + `</g>`;
  s += `<g style="display:none">` + (R.nodes || []).filter(n => n.role === 'row' || n.role === 'text').map(n => { const b = n.bbox.map(px); return `<rect id="ov-${n.id}" class="${n.role}" x="${b[0]}" y="${b[1]}" width="${b[2]-b[0]}" height="${b[3]-b[1]}"/>`; }).join('') + `</g>`;
  s += `<g id="ov-jct" class="layer ov-jct">` + (R.junctions || []).map(j => `<circle id="ov-${j.id}" cx="${px(j.pt[0])}" cy="${px(j.pt[1])}" r="${4*sw}"/>`).join('') + `</g>`;
  s += `<g id="ov-hl" class="layer ov-hl on"></g></svg>`;
  $('#canvas').innerHTML = s; applyLayers(); fit();
  const d = R.detect || {}; const p = R.plan || {}; const sn = p.snapshot || {}; const tt = Object.values(R.times || {}).reduce((a, b) => a + b, 0);
  $('#detect').innerHTML = `<b>${KIND[R.kind] || R.kind}</b> · ${esc(S.name)} · ${esc(S.source)}${d.reason ? ' · 판별 근거 ' + esc(d.reason) : ''}${R.dpi ? ' · ' + R.dpi + ' dpi' : ''}`;
  $('#steps').innerHTML = (STEPS[R.kind] || []).map(x => `<li>${esc(x)}</li>`).join('');
  $('#time').innerHTML = `처리 시간 합계 <b>${tt.toFixed(1)}초</b> · CPU 자동 설정(코어 ${sn.cores ?? '-'} · 스레드 ${p.threads ?? '-'} · 메모리 ${sn.total_gb ?? '-'} GB)`;
  $('#meta').innerHTML = `표본 <b>${SAMPLES.length}</b>건 · 처리 도구 CPU 전용 · 생성형 VLM 미사용`;
  const L = R.serial || []; $('#serial').textContent = L.join('\n'); $('#scount').textContent = `· ${L.length}줄${R.index && R.index.bm25 ? ' · ' + R.index.bm25.tokens + ' 토큰' : ''}`;
  graph();
  $('#qout').textContent = (R.runs || []).length ? '' : '관계 없음'; $('#qtag').value = S.qtag || '';
  if (S.qtag && (R.runs || []).length) query();
  $('#foot').textContent = '처리 결과를 담은 정적 화면. 새 입력은 저장소의 처리 도구로 같은 화면 생성';
}
$('#copy').addEventListener('click', () => navigator.clipboard && navigator.clipboard.writeText($('#serial').textContent));

function graph(){
  const svg = $('#gsvg'); svg.innerHTML = '';
  const nodes = (R.nodes || []).filter(n => !['mark','arrow'].includes(n.role) && !n.attached_to);
  const lift = id => { const n = (R.nodes || []).find(x => x.id === id); return n && n.attached_to ? n.attached_to : id; };
  const ids = new Set(nodes.map(n => n.id)); const J = new Set();
  const edges = []; (R.runs || []).forEach(r => { const a = lift(r.a), b = lift(r.b); if (a === b || a.startsWith('open') || b.startsWith('open')) return; [a, b].forEach(v => { if (v.startsWith('j')) J.add(v); }); if ((ids.has(a) || J.has(a)) && (ids.has(b) || J.has(b))) edges.push({a, b, kind: r.kind, id: r.id}); });
  $('#gcount').textContent = nodes.length ? `· 노드 ${nodes.length + J.size} · 간선 ${edges.length}` : '· 없음';
  if (!nodes.length) return;
  const pos = {}; const all = [...nodes.map(n => ({id: n.id, role: n.role, c: [(n.bbox[0]+n.bbox[2])/2, (n.bbox[1]+n.bbox[3])/2], name: nameOf(n)})), ...[...J].map(j => { const jj = (R.junctions || []).find(x => x.id === j); return {id: j, role: 'junction', c: jj ? jj.pt : [0, 0], name: ''}; })];
  const xs = all.map(a => a.c[0]), ys = all.map(a => a.c[1]); const x0 = Math.min(...xs), x1 = Math.max(...xs), y0 = Math.min(...ys), y1 = Math.max(...ys);
  // 연결이 있는 요소는 힘 기반 배치, 연결이 없는 요소는 아래 띠에 격자로 둠
  const linked = new Set(); edges.forEach(e => { linked.add(e.a); linked.add(e.b); });
  const conn = all.filter(a => linked.has(a.id)), iso = all.filter(a => !linked.has(a.id));
  const yMax = iso.length ? 290 : 380, cy = iso.length ? 155 : 200;
  conn.forEach(a => pos[a.id] = [30 + (a.c[0] - x0) / ((x1 - x0) || 1) * 580, 30 + (a.c[1] - y0) / ((y1 - y0) || 1) * (yMax - 50)]);
  const k = Math.sqrt(640 * (yMax - 20) / Math.max(1, conn.length)) * 0.45; const N = conn.length > 400 ? 60 : 220;
  for (let it = 0; it < N; it++) { const disp = {}; conn.forEach(a => disp[a.id] = [0, 0]); const T = 18 * (1 - it / N) + 0.5;
    for (let i = 0; i < conn.length; i++) for (let j = i + 1; j < conn.length; j++) { const u = conn[i].id, v = conn[j].id; let dx = pos[u][0] - pos[v][0], dy = pos[u][1] - pos[v][1]; let d = Math.hypot(dx, dy) || 0.01; const f = k * k / d; disp[u][0] += dx / d * f; disp[u][1] += dy / d * f; disp[v][0] -= dx / d * f; disp[v][1] -= dy / d * f; }
    edges.forEach(e => { let dx = pos[e.a][0] - pos[e.b][0], dy = pos[e.a][1] - pos[e.b][1]; let d = Math.hypot(dx, dy) || 0.01; const f = d * d / k; disp[e.a][0] -= dx / d * f; disp[e.a][1] -= dy / d * f; disp[e.b][0] += dx / d * f; disp[e.b][1] += dy / d * f; });
    conn.forEach(a => { disp[a.id][0] -= (pos[a.id][0] - 320) * 0.03; disp[a.id][1] -= (pos[a.id][1] - cy) * 0.03; const d = Math.hypot(...disp[a.id]) || 0.01; const m = Math.min(d, T); pos[a.id][0] = Math.max(20, Math.min(620, pos[a.id][0] + disp[a.id][0] / d * m)); pos[a.id][1] = Math.max(20, Math.min(yMax, pos[a.id][1] + disp[a.id][1] / d * m)); }); }
  const step = iso.length > 120 ? 9 : (iso.length > 60 ? 12 : 16); const perRow = Math.floor(600 / step);
  iso.forEach((a, i) => pos[a.id] = [24 + (i % perRow) * step, 318 + Math.floor(i / perRow) * step]);
  const col = {equipment:'var(--eq)', instrument:'var(--ins)', junction:'var(--jct)', note:'var(--ins)', table:'var(--tbl)', row:'var(--txt)', figure:'var(--fig)', part:'var(--fig)', photo:'var(--fig)', paragraph:'var(--mute)', callout:'var(--ins)', dimension:'var(--ins)', datum:'var(--ins)', text:'var(--txt)'};
  let s = edges.map(e => `<line class="e ${e.kind}" x1="${pos[e.a][0]}" y1="${pos[e.a][1]}" x2="${pos[e.b][0]}" y2="${pos[e.b][1]}"/>`).join('');

function highlight(nodeIds, runIds){

function nameOf(n){ const tags = n.texts.map(t => /^([A-Z]{1,2} ?)([0-9O]{4})$/.exec(t)).filter(Boolean).map(m => m[1] + m[2].replace(/O/g, '0')); if (tags.length) return tags[0]; if (n.role === 'instrument') return n.texts.slice(0, 2).join(' '); const c = n.texts.filter(t => !/^N[0-9I]{1,2}$/.test(t) && !/^[\d.,\/\-%]+$/.test(t)); if (c.length) return c[0]; return n.id; }
function subgraph(tag, depth){

  const lift = id => nodes[id] && nodes[id].attached_to ? nodes[id].attached_to : id;

  const where = id => { if (nodes[id]) return 'bbox=(' + nodes[id].bbox.map(v => v.toFixed(1)).join(',') + ')'; const j = (R.junctions || []).find(x => x.id === id); return j ? `pt=(${j.pt[0].toFixed(1)},${j.pt[1].toFixed(1)})` : ''; };
  let start = (R.nodes || []).find(n => nameOf(n) === tag || n.texts.includes(tag) || n.id === tag) || (R.nodes || []).find(n => tag.length >= 3 && n.texts.some(x => x.includes(tag)));
  if (!start) return {found: false, lines: [`'${tag}' 이름의 요소 없음`], nodes: [], runs: []};
  start = lift(start.id);
  const adj = {}; (R.runs || []).forEach(r => { const a = lift(r.a), b = lift(r.b); if (a === b) return; (adj[a] = adj[a] || []).push([b, r]); (adj[b] = adj[b] || []).push([a, r]); });

  for (let d = 0; d < depth; d++) { const nxt = []; frontier.forEach(v => (adj[v] || []).forEach(([w, r]) => { if (used.has(r.id)) return; used.add(r.id); sub.push([v, w, r]); if (!seen.has(w)) { seen.add(w); nxt.push(w); } })); frontier = nxt; }

  sub.forEach(([v, w, r]) => lines.push(`${label(v)} --${r.id}${r.texts.length ? '(' + r.texts.join('|') + ')' : ''} ${EDGE[r.kind] || r.kind}--> ${label(w)} 근거=${where(v)} ${where(w)}`));

}
